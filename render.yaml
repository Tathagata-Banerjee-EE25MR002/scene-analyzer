# Render Blueprint: in the Render dashboard choose New > Blueprint and point it at this repo.
# Render asks for the values marked sync: false the first time the Blueprint is created.
# (For a service that already exists, add them under its Environment tab instead.)
services:
  - type: web
    name: scene-analyzer
    runtime: docker
    plan: free            # free instances sleep when idle (the first request after a pause is slow); use starter for always-on
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL       # a persistent Postgres, e.g. a Neon connection string (see README)
        sync: false
      - key: ADMIN_USERNAME     # your own account; created on first start
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: REGISTRATION_CODE  # the invite code you give people so they can create an account
        sync: false
      - key: SECRET_KEY         # signs the login cookies
        generateValue: true
